version: '3.8'

services:
  # Laravel API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suresign_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./backend/.env.docker:/var/www/html/.env
      - /var/www/html/vendor
      # ── Local Document Mirror (optional) ──────────────────────────────────
      # To mirror SureSign files to your PC's Documents folder, uncomment and
      # edit ONE of the lines below to match your OS, then set:
      #   SURESIGN_LOCAL_MIRROR_PATH=/var/www/html/storage/app/local-mirror/SureSign
      # in your .env or backend .env.docker file.
      #
      # Windows:
      #   - "C:/Users/Admin/Documents/SureSign:/var/www/html/storage/app/local-mirror/SureSign"
      # Mac:
      #   - "/Users/admin/Documents/SureSign:/var/www/html/storage/app/local-mirror/SureSign"
      # Linux:
      #   - "/home/admin/Documents/SureSign:/var/www/html/storage/app/local-mirror/SureSign"
      # ─────────────────────────────────────────────────────────────────────
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_DATABASE=suresign
      - DB_USERNAME=suresign
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - suresign

  # Next.js Frontend (dev mode — hot reload)
  frontend:
    image: node:20-alpine
    container_name: suresign_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - suresign

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: suresign_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: suresign
      MYSQL_USER: suresign
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usuresign", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suresign

  # Redis (for queues & cache)
  redis:
    image: redis:7-alpine
    container_name: suresign_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - suresign

  # Laravel queue worker (processes AI analyses and other background jobs)
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suresign_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=1 --timeout=480 --sleep=3
    volumes:
      - ./backend:/var/www/html
      - ./backend/.env.docker:/var/www/html/.env
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_DATABASE=suresign
      - DB_USERNAME=suresign
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - suresign

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: suresign_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - suresign

networks:
  suresign:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules:
  frontend_next:
