# Production Compose file — image-based only. No source-code bind mounts:
# every container runs exclusively from what was COPY'd into its built image.
# Local-only overrides (bind mounts, dev ports, debug env) belong in
# docker-compose.dev.yml, never here — see that file's header comment.

services:
  # Laravel API — the single image backend/queue/scheduler all run from.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: suresign-backend:latest
    container_name: suresign_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Only genuinely persistent data survives container recreation —
      # user-uploaded and generated files (logos, letterheads, contracts,
      # generated documents). Everything else ships inside the image.
      - backend_storage:/var/www/html/storage/app
    environment: &backend_env
      # SureSign timezone architecture: UTC only, at every layer. Verified
      # UTC already via the base image default — set explicitly so a future
      # base-image change can't silently alter it.
      - TZ=UTC
      - APP_NAME=SureSign
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://app.suresigncontracts.app}
      - FRONTEND_URL=${FRONTEND_URL:-https://app.suresigncontracts.app}
      - APP_TIMEZONE=UTC
      - APP_LOCALE=en
      - APP_FALLBACK_LOCALE=en
      - APP_FAKER_LOCALE=en_US
      - APP_MAINTENANCE_DRIVER=file
      - BCRYPT_ROUNDS=12
      - LOG_CHANNEL=stack
      - LOG_STACK=single
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=suresign
      - DB_USERNAME=suresign
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - SESSION_ENCRYPT=false
      - SESSION_PATH=/
      - SESSION_DOMAIN=null
      - BROADCAST_CONNECTION=log
      - FILESYSTEM_DISK=local
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - MAIL_MAILER=log
      - MAIL_SCHEME=null
      - MAIL_HOST=127.0.0.1
      - MAIL_PORT=2525
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_FROM_ADDRESS=noreply@suresign.app
      - MAIL_FROM_NAME=SureSign
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=${AWS_BUCKET:-}
      - AWS_USE_PATH_STYLE_ENDPOINT=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini
      - AI_MAX_TOKENS=4096
      - VITE_APP_NAME=SureSign
      - COMPANIES_HOUSE_API_KEY=${COMPANIES_HOUSE_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    # Verified compatible in a disposable test: migrations, storage:link,
    # artisan serve, and a real LibreOffice DOCX→PDF conversion all still
    # work under this — see report. Doesn't replace running as www-data,
    # it's an additional layer blocking any setuid/setgid-based privilege
    # escalation for the lifetime of the container.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Laravel's own built-in /up route (registered via the `health:` param
      # in bootstrap/app.php) — no auth, no throttle:api middleware, no DB
      # query, no tenant data. It only proves the PHP process is up and
      # Laravel can bootstrap/dispatch an event (liveness), which is exactly
      # what's needed here since MySQL readiness is already covered by its
      # own healthcheck + this service's `depends_on: mysql: service_healthy`.
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 20s
      timeout: 5s
      retries: 3
      # entrypoint.sh runs `migrate --force` before `artisan serve` starts
      # listening — give that a real window before failures count.
      start_period: 30s
    networks:
      - suresign

  # Next.js Frontend (production build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.suresigncontracts.app/api}
    image: suresign-frontend:latest
    container_name: suresign_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Server-side only (not NEXT_PUBLIC_) — reaches the backend over the
      # internal docker network, unlike NEXT_PUBLIC_API_URL which is the
      # public URL baked into the browser bundle at build time.
      - BACKEND_INTERNAL_URL=http://backend:8000/api
      # Docker auto-sets HOSTNAME to the container ID; Next's standalone
      # server.js binds to whatever HOSTNAME resolves to unless told
      # otherwise, so without this it was only reachable via the
      # container's own assigned IP — 0.0.0.0 makes it bind all IPv4
      # interfaces explicitly (found and verified against the real
      # production image, not the dev server, during non-root testing).
      - HOSTNAME=0.0.0.0
      # Consistency only — the frontend doesn't do server-side date/business
      # logic that depends on this, but every container in the stack runs
      # the same explicit clock per SureSign's timezone architecture.
      - TZ=UTC
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /login is a stable, unauthenticated, always-rendered page (no
      # server-side fetch to backend in its initial render — see
      # frontend/src/app/login/page.tsx) — proves the Next.js server itself
      # is listening and responding, independent of backend availability.
      # Uses 127.0.0.1, not localhost: Alpine's resolver returns ::1 first,
      # and the server only binds IPv4 — localhost would connect-refuse
      # every single check (verified empirically against the real image).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - suresign

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: suresign_mysql
    restart: unless-stopped
    # Pins the server's own default time_zone to UTC explicitly — the app's
    # PDO connections already force `SET time_zone='+00:00'` per-session
    # (see backend/config/database.php), but @@global.time_zone otherwise
    # defaults to `SYSTEM` (the container OS clock, verified UTC but not an
    # enforced fact on its own). This closes that gap for any other client
    # (mysql CLI, a GUI tool, a future non-Laravel connection).
    command: --default-time-zone=+00:00
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: suresign
      MYSQL_USER: suresign
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Password passed via MYSQL_PWD (read from this container's own
      # already-set MYSQL_PASSWORD env var at check-execution time, not
      # baked into the compose file) rather than `-p<value>` — avoids both
      # mysqladmin's own "using a password on the command line can be
      # insecure" warning and the plaintext password showing up in
      # `docker inspect`'s Healthcheck.Test field. $$ escapes Compose's own
      # variable interpolation so the literal string `$MYSQL_PASSWORD`
      # reaches the container, to be resolved by its shell at runtime.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -usuresign"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - suresign

  # Redis (for queues & cache)
  redis:
    image: redis:7-alpine
    container_name: suresign_redis
    restart: unless-stopped
    environment:
      # Redis itself is timezone-agnostic (no date logic), set purely for
      # stack-wide consistency per SureSign's timezone architecture.
      - TZ=UTC
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - suresign

  # Laravel queue worker — same image as `backend`, no separate build/mount.
  queue:
    image: suresign-backend:latest
    container_name: suresign_queue
    restart: unless-stopped
    command: ["queue"]
    volumes:
      - backend_storage:/var/www/html/storage/app
    environment: *backend_env
    depends_on:
      # Upgraded from service_started: entrypoint.sh only runs `migrate
      # --force` in backend's own default branch (queue/scheduler never run
      # migrations themselves — confirmed, no concurrent-migration race
      # exists) — but service_started only meant "the container process
      # launched," not "migrations finished." On a cold deploy with ~115
      # migrations, queue/scheduler could start and hit the database before
      # backend's schema is ready. service_healthy waits for backend's own
      # /up healthcheck, which only succeeds once migrate + storage:link +
      # artisan serve have all completed.
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # entrypoint.sh `exec`s straight into `artisan queue:work`, so it runs
      # as PID 1 — pgrep confirms the worker process itself hasn't exited
      # (restart: unless-stopped already restarts the container if it has;
      # this is mainly for Dokploy/`docker ps` visibility — see report).
      # `php artisan --version` is a near-instant, DB-free bootstrap check —
      # confirms Laravel itself isn't fatally broken, without touching the
      # queue, enqueuing anything, or running real business logic.
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null && php artisan --version > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - suresign

  # Laravel scheduler — same image as `backend`, no separate build/mount.
  scheduler:
    image: suresign-backend:latest
    container_name: suresign_scheduler
    restart: unless-stopped
    command: ["scheduler"]
    volumes:
      - backend_storage:/var/www/html/storage/app
    environment: *backend_env
    depends_on:
      # Upgraded from service_started: entrypoint.sh only runs `migrate
      # --force` in backend's own default branch (queue/scheduler never run
      # migrations themselves — confirmed, no concurrent-migration race
      # exists) — but service_started only meant "the container process
      # launched," not "migrations finished." On a cold deploy with ~115
      # migrations, queue/scheduler could start and hit the database before
      # backend's schema is ready. service_healthy waits for backend's own
      # /up healthcheck, which only succeeds once migrate + storage:link +
      # artisan serve have all completed.
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Same rationale as `queue` above — process-liveness + Laravel
      # bootstrap, no schedule:run invocation (would risk re-triggering real
      # scheduled business commands on every check interval).
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null && php artisan --version > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - suresign

  # Nginx reverse proxy
  nginx:
    # Pinned to the minor version actually verified in this stack (1.31.x)
    # rather than the floating `nginx:alpine` tag, which could silently jump
    # major versions on the next pull. Matches the pinning granularity
    # already used for mysql:8.0/redis:7-alpine — patch releases (1.31.1,
    # 1.31.2, ...) still apply automatically; a future major/minor bump
    # requires deliberately updating this tag. Not digest-pinned: the
    # maintenance overhead of tracking a specific digest isn't justified for
    # a well-maintained official image with a stable minor-version tag.
    image: nginx:1.31-alpine
    container_name: suresign_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Upgraded from service_started now that backend/frontend both carry
      # their own healthchecks — Nginx won't start routing until both are
      # actually ready, not just "container created." This only affects
      # startup ordering: if either becomes unhealthy later at runtime,
      # Compose does not stop or restart Nginx because of it — depends_on
      # is not a live dependency monitor (see docker-compose.prod.yml
      # deployment notes / task report for the full caveat).
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # Verified compatible in a disposable test: master (root, binds :80) →
    # worker (nginx user) privilege drop, plus full proxying to both
    # frontend and backend, all still work under this.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Option A (Nginx's own availability only) chosen deliberately over
      # Option B (proxying through to an upstream): backend and frontend
      # already have independent healthchecks, so making Nginx's check also
      # depend on them would just make Nginx flip unhealthy on every
      # transient upstream blip that isn't an Nginx problem — worse
      # diagnostic signal, not better. /nginx-health is served directly by
      # Nginx (see docker/nginx/default.conf), no proxy_pass involved.
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - suresign

  # Public SureSign User Guide (docs.suresigncontracts.app) — fully static,
  # built from docs/ + mkdocs.yml at repo root. Independent of the main app's
  # `nginx` reverse proxy above; wire docs.suresigncontracts.app to this
  # service's port directly in Dokploy (or your reverse proxy of choice).
  docs:
    build:
      context: .
      dockerfile: docker/docs/Dockerfile
    image: suresign-docs:latest
    container_name: suresign_docs
    restart: unless-stopped
    ports:
      - "8082:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/docs-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - suresign

  # Public marketing site (intended for suresigncontracts.app once the app
  # itself is migrated to app.suresigncontracts.app — that domain cutover is
  # a separate, deliberate step and is NOT done by this service definition).
  # Independent of the main app's `nginx` reverse proxy, same pattern as
  # `frontend`/`docs` above. Wire the target domain to this service's port
  # directly in Dokploy once the cutover is ready.
  marketing:
    build:
      context: ./marketing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${MARKETING_NEXT_PUBLIC_API_URL:-https://app.suresigncontracts.app/api}
    image: suresign-marketing:latest
    container_name: suresign_marketing
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - HOSTNAME=0.0.0.0
    security_opt:
      - no-new-privileges:true
    networks:
      - suresign

networks:
  suresign:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_storage:
