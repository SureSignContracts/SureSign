# Production Compose file — image-based only. No source-code bind mounts:
# every container runs exclusively from what was COPY'd into its built image.
# Local-only overrides (bind mounts, dev ports, debug env) belong in
# docker-compose.dev.yml, never here — see that file's header comment.

services:
  # Laravel API — the single image backend/queue/scheduler all run from.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: suresign-backend:latest
    container_name: suresign_backend
    restart: unless-stopped
    # No host-published port. nginx reaches this container over the internal
    # `suresign` Docker network by service name (`backend:8000`) regardless
    # of whether the port is also published to the host — publishing 8000
    # only ever exposed the app directly, bypassing nginx (the trusted-proxy
    # IP handling in bootstrap/app.php was already written anticipating
    # exactly that gap). Removed as part of the production-readiness audit;
    # takes effect on the next deploy, not live until then.
    stop_grace_period: 30s
    volumes:
      # Only genuinely persistent data survives container recreation —
      # user-uploaded and generated files (logos, letterheads, contracts,
      # generated documents). Everything else ships inside the image.
      - backend_storage:/var/www/html/storage/app
    environment: &backend_env
      # SureSign timezone architecture: UTC only, at every layer. Verified
      # UTC already via the base image default — set explicitly so a future
      # base-image change can't silently alter it.
      - TZ=UTC
      - APP_NAME=SureSign
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://app.suresigncontracts.app}
      - FRONTEND_URL=${FRONTEND_URL:-https://app.suresigncontracts.app}
      # Separate from FRONTEND_URL — the marketing site only ever calls
      # public marketing/appointment endpoints, never authenticates against
      # the app API (see backend/config/cors.php). Without this, every
      # browser-side fetch from the marketing site (contact form, demo
      # booking) is blocked by CORS once the site is reachable on its own
      # domain.
      - MARKETING_URL=${MARKETING_URL:-https://suresigncontracts.app}
      - APP_TIMEZONE=UTC
      - APP_LOCALE=en
      - APP_FALLBACK_LOCALE=en
      - APP_FAKER_LOCALE=en_US
      - APP_MAINTENANCE_DRIVER=file
      - BCRYPT_ROUNDS=12
      # stderr, not single alone: `storage/logs/laravel.log` is not on the
      # `backend_storage` volume (that only covers storage/app), so file-only
      # logs were invisible to `docker logs` and lost on every container
      # replacement — the exact gap flagged in production-readiness-audit.md
      # Section 5.4. stderr is captured by Docker's own log driver (same as
      # nginx/mysql/redis's official images, which already log to
      # stdout/stderr by default) and survives container replacement via
      # whatever log retention the host/Dokploy keeps. `single` stays too, for
      # a quick `docker exec ... tail -f storage/logs/laravel.log` during a
      # live incident without needing docker log access — see
      # production-operations.md's Logging section.
      - LOG_CHANNEL=stack
      - LOG_STACK=stderr,single
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=suresign
      - DB_USERNAME=suresign
      - DB_PASSWORD=${DB_PASSWORD}
      # database, not file: SureSign authenticates via Sanctum bearer tokens
      # (routes/api.php uses auth:sanctum; no EnsureFrontendRequestsAreStateful
      # middleware is registered), so server-side sessions aren't materially
      # used — but `file` sessions are container-local state, a real rolling-
      # deployment blocker if anything under the `web` middleware group ever
      # starts one. `database` is already a shared store (the `sessions`
      # table already exists via the users-table migration) at zero added
      # infrastructure cost, unlike moving unused sessions to Redis.
      - SESSION_DRIVER=database
      - SESSION_LIFETIME=120
      - SESSION_ENCRYPT=false
      - SESSION_PATH=/
      - SESSION_DOMAIN=null
      - BROADCAST_CONNECTION=log
      - FILESYSTEM_DISK=local
      # database, not redis: queue jobs (AI analysis, document generation)
      # already have carefully-tuned retry_after/timeout relationships against
      # the database driver (see config/queue.php) — moving to Redis needs its
      # own isolated retry_after review, deferred to a separate phase.
      - QUEUE_CONNECTION=database
      # Re-enabled 2026-07-20 after a prior attempt caused a full production
      # outage: `phpredis` (REDIS_CLIENT=phpredis) was never actually
      # installed in this Dockerfile, so RedisManager threw `Class "Redis"
      # not found` on every single request the instant a rebuilt image went
      # live (Laravel's rate-limiter middleware touches the cache store on
      # every API request). The extension is now installed in
      # backend/Dockerfile and was verified locally end-to-end: rebuilt the
      # image, confirmed `php -m` lists redis, then made a real HTTP request
      # (`/readyz`, which passes through the rate-limiter's cache touch)
      # against the container with CACHE_STORE=redis and got a 200 — not
      # just `redis-cli ping` against the container. If this ever needs to
      # be reverted again, set this back to `database` (no extension
      # dependency) — do not attempt any other cache store without repeating
      # the same real-HTTP-request verification first.
      - CACHE_STORE=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - MAIL_MAILER=log
      - MAIL_SCHEME=null
      - MAIL_HOST=127.0.0.1
      - MAIL_PORT=2525
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_FROM_ADDRESS=noreply@suresign.app
      - MAIL_FROM_NAME=SureSign
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=${AWS_BUCKET:-}
      - AWS_USE_PATH_STYLE_ENDPOINT=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini
      - AI_MAX_TOKENS=4096
      - VITE_APP_NAME=SureSign
      - COMPANIES_HOUSE_API_KEY=${COMPANIES_HOUSE_API_KEY:-}
      # Google Integration (Stage 4A) — was set in Dokploy's Environment tab
      # but never referenced anywhere in this file, so it never actually
      # reached the container regardless of redeploys. Needed on backend AND
      # queue (SyncAppointmentCalendarEventJob runs the same OAuth client).
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
    depends_on:
      mysql:
        condition: service_healthy
    # Verified compatible in a disposable test: migrations, storage:link,
    # artisan serve, and a real LibreOffice DOCX→PDF conversion all still
    # work under this — see report. Doesn't replace running as www-data,
    # it's an additional layer blocking any setuid/setgid-based privilege
    # escalation for the lifetime of the container.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /readyz (routes/web.php), not Laravel's built-in /up: /up only proves
      # the process booted (liveness) — it never touches the database. Since
      # entrypoint.sh no longer runs `migrate --force` before `artisan serve`
      # starts (migrations are now a deliberate, separate release step — see
      # entrypoint.sh), a booted process is no longer proof the database is
      # reachable, and every real request needs it. /readyz does one cheap
      # PDO check, no query, and this is exactly the distinction a future
      # start-first rolling update needs: don't route traffic to the new
      # container until it can actually serve, not just until it's alive.
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - suresign
    # Forward-looking only — Dokploy's plain Compose mode ignores `deploy:`
    # entirely (confirmed: https://github.com/Dokploy/dokploy/issues/2497),
    # so this has no live effect today. Kept here so a later Stack-mode
    # conversion is a config-flip, not a from-scratch design exercise.
    # Values are intentionally conservative and unmeasured: no memory
    # limit/reservation is set because no real production memory metrics
    # have been captured yet (see Docs → Production Readiness Audit) — set
    # those from Dokploy's Monitoring tab data before relying on this in a
    # real Stack deployment, not from a guess.
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any

  # Next.js Frontend (production build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.suresigncontracts.app/api}
    image: suresign-frontend:latest
    container_name: suresign_frontend
    restart: unless-stopped
    # No host-published port, same rationale as `backend` above: nginx
    # reaches this container over the internal `suresign` network by service
    # name (`frontend:3000`), so publishing 3001 to the host only added
    # unnecessary direct exposure.
    stop_grace_period: 15s
    environment:
      # Server-side only (not NEXT_PUBLIC_) — reaches the backend over the
      # internal docker network, unlike NEXT_PUBLIC_API_URL which is the
      # public URL baked into the browser bundle at build time.
      - BACKEND_INTERNAL_URL=http://backend:8000/api
      # Docker auto-sets HOSTNAME to the container ID; Next's standalone
      # server.js binds to whatever HOSTNAME resolves to unless told
      # otherwise, so without this it was only reachable via the
      # container's own assigned IP — 0.0.0.0 makes it bind all IPv4
      # interfaces explicitly (found and verified against the real
      # production image, not the dev server, during non-root testing).
      - HOSTNAME=0.0.0.0
      # Consistency only — the frontend doesn't do server-side date/business
      # logic that depends on this, but every container in the stack runs
      # the same explicit clock per SureSign's timezone architecture.
      - TZ=UTC
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /login is a stable, unauthenticated, always-rendered page (no
      # server-side fetch to backend in its initial render — see
      # frontend/src/app/login/page.tsx) — proves the Next.js server itself
      # is listening and responding, independent of backend availability.
      # Uses 127.0.0.1, not localhost: Alpine's resolver returns ::1 first,
      # and the server only binds IPv4 — localhost would connect-refuse
      # every single check (verified empirically against the real image).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - suresign
    # Forward-looking only, no live effect under Compose mode — see the
    # `backend` service's `deploy:` block above for the full rationale.
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: suresign_mysql
    restart: unless-stopped
    # Pins the server's own default time_zone to UTC explicitly — the app's
    # PDO connections already force `SET time_zone='+00:00'` per-session
    # (see backend/config/database.php), but @@global.time_zone otherwise
    # defaults to `SYSTEM` (the container OS clock, verified UTC but not an
    # enforced fact on its own). This closes that gap for any other client
    # (mysql CLI, a GUI tool, a future non-Laravel connection).
    command: --default-time-zone=+00:00
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: suresign
      MYSQL_USER: suresign
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Password passed via MYSQL_PWD (read from this container's own
      # already-set MYSQL_PASSWORD env var at check-execution time, not
      # baked into the compose file) rather than `-p<value>` — avoids both
      # mysqladmin's own "using a password on the command line can be
      # insecure" warning and the plaintext password showing up in
      # `docker inspect`'s Healthcheck.Test field. $$ escapes Compose's own
      # variable interpolation so the literal string `$MYSQL_PASSWORD`
      # reaches the container, to be resolved by its shell at runtime.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -usuresign"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - suresign

  # Redis (for queues & cache)
  redis:
    image: redis:7-alpine
    container_name: suresign_redis
    restart: unless-stopped
    environment:
      # Redis itself is timezone-agnostic (no date logic), set purely for
      # stack-wide consistency per SureSign's timezone architecture.
      - TZ=UTC
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - suresign

  # Laravel queue worker — same image as `backend`, no separate build/mount.
  queue:
    image: suresign-backend:latest
    container_name: suresign_queue
    restart: unless-stopped
    command: ["queue"]
    volumes:
      - backend_storage:/var/www/html/storage/app
    environment: *backend_env
    # AnalyseContractWithAiJob's timeout is 480s (see backend/config/queue.php
    # comment: must stay under DB_QUEUE_RETRY_AFTER=600s so a still-running
    # job is never re-reserved and re-executed — that would double-bill
    # Claude). Docker's default stop_grace_period is 10s: SIGTERM, then
    # SIGKILL if the process hasn't exited. `queue:work` handles SIGTERM
    # gracefully (finish the current job, then stop — pcntl is installed in
    # backend/Dockerfile) but only if it's actually given the time; without
    # this, every deploy or restart hard-kills whatever job happens to be
    # running, mid-AI-analysis or mid-document-generation. 490s covers the
    # longest job (480s) plus a small margin for the worker to notice SIGTERM
    # and exit cleanly.
    stop_grace_period: 490s
    depends_on:
      # Migrations are no longer run automatically on `backend`'s startup
      # (see entrypoint.sh) — they're now a deliberate, separate release
      # step, so `backend: service_healthy` no longer implies "schema is
      # ready" the way it did before this audit. It still correctly implies
      # "backend can reach MySQL" (via /readyz) and "the image booted", which
      # is the ordering guarantee actually needed here. Operationally: run
      # the `migrate` release step before or as the first step of a deploy,
      # not after — queue/scheduler do not wait for it.
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # entrypoint.sh `exec`s straight into `artisan queue:work`, so it runs
      # as PID 1 — pgrep confirms the worker process itself hasn't exited
      # (restart: unless-stopped already restarts the container if it has;
      # this is mainly for Dokploy/`docker ps` visibility — see report).
      # `php artisan --version` is a near-instant, DB-free bootstrap check —
      # confirms Laravel itself isn't fatally broken, without touching the
      # queue, enqueuing anything, or running real business logic.
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null && php artisan --version > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - suresign

  # Laravel scheduler — same image as `backend`, no separate build/mount.
  scheduler:
    image: suresign-backend:latest
    container_name: suresign_scheduler
    restart: unless-stopped
    command: ["scheduler"]
    volumes:
      - backend_storage:/var/www/html/storage/app
    environment: *backend_env
    # schedule:work dispatches jobs rather than running long business logic
    # itself, so it needs far less grace than `queue`, but a small window
    # still lets an in-flight dispatch finish cleanly instead of being cut off
    # mid-tick.
    stop_grace_period: 30s
    depends_on:
      # Migrations are no longer run automatically on `backend`'s startup —
      # see the `queue` service's depends_on comment above for the full
      # rationale, which applies identically here.
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Same rationale as `queue` above — process-liveness + Laravel
      # bootstrap, no schedule:run invocation (would risk re-triggering real
      # scheduled business commands on every check interval).
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null && php artisan --version > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - suresign

  # Nginx reverse proxy
  nginx:
    # Pinned to the minor version actually verified in this stack (1.31.x)
    # rather than the floating `nginx:alpine` tag, which could silently jump
    # major versions on the next pull. Matches the pinning granularity
    # already used for mysql:8.0/redis:7-alpine — patch releases (1.31.1,
    # 1.31.2, ...) still apply automatically; a future major/minor bump
    # requires deliberately updating this tag. Not digest-pinned: the
    # maintenance overhead of tracking a specific digest isn't justified for
    # a well-maintained official image with a stable minor-version tag.
    image: nginx:1.31-alpine
    container_name: suresign_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Upgraded from service_started now that backend/frontend both carry
      # their own healthchecks — Nginx won't start routing until both are
      # actually ready, not just "container created." This only affects
      # startup ordering: if either becomes unhealthy later at runtime,
      # Compose does not stop or restart Nginx because of it — depends_on
      # is not a live dependency monitor (see docker-compose.prod.yml
      # deployment notes / task report for the full caveat).
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # Verified compatible in a disposable test: master (root, binds :80) →
    # worker (nginx user) privilege drop, plus full proxying to both
    # frontend and backend, all still work under this.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Option A (Nginx's own availability only) chosen deliberately over
      # Option B (proxying through to an upstream): backend and frontend
      # already have independent healthchecks, so making Nginx's check also
      # depend on them would just make Nginx flip unhealthy on every
      # transient upstream blip that isn't an Nginx problem — worse
      # diagnostic signal, not better. /nginx-health is served directly by
      # Nginx (see docker/nginx/default.conf), no proxy_pass involved.
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - suresign

  # Public SureSign User Guide (docs.suresigncontracts.app) — fully static,
  # built from docs/ + mkdocs.yml at repo root. Independent of the main app's
  # `nginx` reverse proxy above; wire docs.suresigncontracts.app to this
  # service's port directly in Dokploy (or your reverse proxy of choice).
  docs:
    build:
      context: .
      dockerfile: docker/docs/Dockerfile
    image: suresign-docs:latest
    container_name: suresign_docs
    restart: unless-stopped
    ports:
      - "8082:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/docs-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - suresign

  # Public marketing site (intended for suresigncontracts.app once the app
  # itself is migrated to app.suresigncontracts.app — that domain cutover is
  # a separate, deliberate step and is NOT done by this service definition).
  # Independent of the main app's `nginx` reverse proxy, same pattern as
  # `frontend`/`docs` above. Wire the target domain to this service's port
  # directly in Dokploy once the cutover is ready.
  marketing:
    build:
      context: ./marketing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${MARKETING_NEXT_PUBLIC_API_URL:-https://app.suresigncontracts.app/api}
        # Organisation URL Branding, Phase 4 — where the branded login
        # gateway hands off to after "Continue to Sign In". A build ARG
        # (not just a runtime `environment:` entry) because NEXT_PUBLIC_
        # variables are inlined into the client bundle at build time —
        # same reason NEXT_PUBLIC_API_URL above is threaded this way.
        NEXT_PUBLIC_FRONTEND_URL: ${MARKETING_NEXT_PUBLIC_FRONTEND_URL:-https://app.suresigncontracts.app}
    image: suresign-marketing:latest
    container_name: suresign_marketing
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - HOSTNAME=0.0.0.0
      # Server-side only (not NEXT_PUBLIC_) — reaches the backend over the
      # internal docker network for this service's own server-side fetches
      # (lib/pricing.ts, used by the Pricing pages' ISR revalidation and the
      # sitemap), the same reason `frontend` sets it above.
      - BACKEND_INTERNAL_URL=http://backend:8000/api
    security_opt:
      - no-new-privileges:true
    networks:
      - suresign

networks:
  # Explicit fixed name (rather than the Compose-project-prefixed default)
  # so docker-compose.demo.yml can join it as an `external: true` network —
  # this is what lets the demo backend/queue containers resolve `mysql` and
  # `redis` by service name and reuse these same instances (per the approved
  # demo architecture: shared MySQL/Redis with logical isolation, no second
  # database/cache server). Purely an addressing change — does not alter any
  # existing container's behavior on its own.
  suresign:
    name: suresign_shared
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_storage:
