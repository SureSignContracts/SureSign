version: '3.8'

services:
  # Laravel API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suresign_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      # ── Local Document Mirror (optional) ──────────────────────────────────
      # To mirror SureSign files to your PC's Documents folder, uncomment and
      # edit ONE of the lines below to match your OS, then set:
      #   SURESIGN_LOCAL_MIRROR_PATH=/var/www/html/storage/app/local-mirror/SureSign
      # as an environment variable below.
      #
      # Windows:
      #   - "C:/Users/Admin/Documents/SureSign:/var/www/html/storage/app/local-mirror/SureSign"
      # Mac:
      #   - "/Users/admin/Documents/SureSign:/var/www/html/storage/app/local-mirror/SureSign"
      # Linux:
      #   - "/home/admin/Documents/SureSign:/var/www/html/storage/app/local-mirror/SureSign"
      # ─────────────────────────────────────────────────────────────────────
    environment: &backend_env
      - APP_NAME=SureSign
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - APP_LOCALE=en
      - APP_FALLBACK_LOCALE=en
      - APP_FAKER_LOCALE=en_US
      - APP_MAINTENANCE_DRIVER=file
      - BCRYPT_ROUNDS=12
      - LOG_CHANNEL=stack
      - LOG_STACK=single
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=suresign
      - DB_USERNAME=suresign
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - SESSION_ENCRYPT=false
      - SESSION_PATH=/
      - SESSION_DOMAIN=null
      - BROADCAST_CONNECTION=log
      - FILESYSTEM_DISK=local
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - MAIL_MAILER=log
      - MAIL_SCHEME=null
      - MAIL_HOST=127.0.0.1
      - MAIL_PORT=2525
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_FROM_ADDRESS=noreply@suresign.app
      - MAIL_FROM_NAME=SureSign
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=${AWS_BUCKET:-}
      - AWS_USE_PATH_STYLE_ENDPOINT=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini
      - AI_MAX_TOKENS=4096
      - VITE_APP_NAME=SureSign
      - COMPANIES_HOUSE_API_KEY=${COMPANIES_HOUSE_API_KEY:-}
      - SURESIGN_LOCAL_MIRROR_ENABLED=${SURESIGN_LOCAL_MIRROR_ENABLED:-false}
      - SURESIGN_LOCAL_MIRROR_PATH=${SURESIGN_LOCAL_MIRROR_PATH:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - suresign

  # Next.js Frontend (production build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: suresign_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - suresign

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: suresign_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: suresign
      MYSQL_USER: suresign
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usuresign", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suresign

  # Redis (for queues & cache)
  redis:
    image: redis:7-alpine
    container_name: suresign_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - suresign

  # Laravel queue worker (processes AI analyses and other background jobs)
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suresign_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=1 --timeout=480 --sleep=3
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment: *backend_env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - suresign

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: suresign_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - suresign

networks:
  suresign:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
