server_tokens off;

# Defence in depth alongside Cloudflare's own rate limiting (the primary
# control — see internal-docs/demo-environment/deployment.md) — a modest
# per-IP cap specific to the demo's Nginx layer, since this domain has no
# real customer traffic to protect against under-throttling.
limit_req_zone $binary_remote_addr zone=demo_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=demo_login:10m rate=5r/s;

server {
    listen 80;
    server_name demo.suresigncontracts.app;

    # Never indexed — this is a demo instance, not a page anyone should find
    # via search. Cloudflare-side rules are the primary control (see
    # deployment docs); this is a second, independent layer.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    location = /nginx-demo-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Frontend
    location / {
        limit_req zone=demo_general burst=40 nodelay;
        proxy_pass http://demo-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Publicly-served storage disk (branding assets etc.) — mirrors
    # docker/nginx/default.conf's /storage/ block, pointed at the demo
    # backend instead.
    location /storage/ {
        limit_req zone=demo_general burst=40 nodelay;
        proxy_pass http://demo-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # Backend API — a tighter zone on the auth endpoint specifically, since
    # that's the one route worth throttling harder against credential
    # stuffing/brute force on a publicly-reachable demo login.
    location /api/login {
        limit_req zone=demo_login burst=5 nodelay;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Powered-By;
        proxy_pass http://demo-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=demo_general burst=40 nodelay;
        client_max_body_size 64m;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Powered-By;
        proxy_pass http://demo-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
