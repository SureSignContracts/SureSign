server_tokens off;

server {
    listen 80;
    server_name localhost;

    # Security headers — applied at server level so both locations below
    # inherit them (neither declares its own add_header, so nothing here
    # breaks Nginx's add_header inheritance rules). `always` makes each
    # header apply to error responses too, not just 2xx/3xx.
    #
    # No Content-Security-Policy, COOP/COEP/CORP, or HSTS here yet —
    # HSTS specifically is deferred pending operator confirmation that the
    # production domain is HTTPS-only end-to-end (see deployment notes).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # Internal healthcheck target only — proves the Nginx process itself is
    # up and able to serve a response over its configured listen socket.
    # Deliberately does NOT proxy to backend/frontend (see docker-compose.prod.yml
    # healthcheck comment for the Option A vs. B trade-off this reflects):
    # backend and frontend already carry their own independent healthchecks,
    # so Nginx's own check would otherwise flip unhealthy on every transient
    # upstream blip that isn't really an Nginx problem.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
        # Match backend/docker/php.ini's upload_max_filesize/post_max_size (64M) —
        # Nginx's 1M default would otherwise reject valid uploads with a 413
        # before they ever reach PHP's own (already-generous) limit.
        client_max_body_size 64m;

        # Several controllers (DocumentController, DocumentTemplateController)
        # already set X-Content-Type-Options: nosniff on file preview/download
        # responses. Hide the upstream copy so the server-level add_header
        # above is the single source of truth instead of sending the header
        # twice with the same value.
        proxy_hide_header X-Content-Type-Options;

        # Defence in depth for L3 (PHP version disclosure): backend/docker/php.ini
        # already sets expose_php = Off, so PHP itself shouldn't send this header —
        # hiding it here too means a future config regression on the backend
        # still can't leak the PHP version through this proxy.
        proxy_hide_header X-Powered-By;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
