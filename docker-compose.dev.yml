# Local development overrides — hot reload for the frontend.
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.dev.yml up
#
# Dokploy / production deploys should use docker-compose.prod.yml on its own,
# which builds the frontend's production standalone bundle instead.

services:
  frontend:
    image: node:20-alpine
    container_name: suresign_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    build: !reset null
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NODE_ENV=development

volumes:
  frontend_node_modules:
  frontend_next:
