# Local development overrides.
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.dev.yml up
#
# Every local-only value lives in THIS file — hardcoded local-only
# credentials, localhost URLs, dev-mode frontend — so running locally needs
# no separate .env file at all. Dokploy / production only ever points at
# docker-compose.prod.yml directly and never reads this file, so nothing
# here can leak into production on a dev -> main merge. If a feature needs
# a new env var, add its production-safe default to docker-compose.prod.yml
# and, if the local value should differ, override it here too — never edit
# docker-compose.prod.yml itself just to make local testing easier.

services:
  backend:
    build:
      args:
        # Prod builds default to --no-dev (see backend/Dockerfile). Local dev
        # needs phpunit/mockery/faker/pint available inside the image, since
        # the bind mount below only shadows source files — vendor/ is kept
        # from the image via the anonymous volume trick. --optimize-autoloader
        # isn't part of this flag set any more — the Dockerfile's separate
        # `composer dump-autoload --optimize` step applies it unconditionally
        # after the full source is copied, in both prod and dev builds.
        COMPOSER_INSTALL_FLAGS: "--no-interaction --prefer-dist"
    # The prod image now runs as www-data (see backend/Dockerfile) — but the
    # bind mount below is the host's ./backend directory, owned by whatever
    # UID the host developer account is (not necessarily 33), so www-data
    # couldn't write logs/cache/sessions into it. Local dev stays root, which
    # is how it already behaved before this change — this override exists
    # only so a future Dockerfile-level USER doesn't silently break it.
    user: root
    # prod's entrypoint.sh no longer auto-runs migrate/seed on every boot
    # (production-readiness audit: a future multi-replica rolling deploy
    # could otherwise race two concurrent `migrate --force` runs). Local dev
    # has no such concern and wants the old always-migrate-and-seed
    # convenience back — see entrypoint.sh's `dev` branch.
    command: ["dev"]
    # Prod deliberately does NOT publish this port (see docker-compose.prod.yml
    # — nginx reaches backend:8000 over the internal Docker network only, and
    # publishing it there would bypass nginx's trusted-proxy IP handling).
    # That concern doesn't apply to a developer's own machine, and the
    # frontend's NEXT_PUBLIC_API_URL below points directly at localhost:8000
    # (not through nginx), so local dev needs it published — dev-only, never
    # merged into prod.
    ports:
      - "8000:8000"
    # !override replaces (not appends to) prod's `backend_storage` volume —
    # dev wants the host directory fully live, not the prod-only named volume.
    volumes: !override
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment: &local_backend_env
      - APP_NAME=SureSign
      - APP_ENV=local
      - APP_KEY=base64:JXPHvnSFKgimBCcn2vE640OQ8fyoBqMNnXWeXsX+XuY=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3001
      - APP_LOCALE=en
      - APP_FALLBACK_LOCALE=en
      - APP_FAKER_LOCALE=en_US
      - APP_MAINTENANCE_DRIVER=file
      - BCRYPT_ROUNDS=12
      - LOG_CHANNEL=stack
      - LOG_STACK=single
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=suresign
      - DB_USERNAME=suresign
      - DB_PASSWORD=SureSign@2024!
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - SESSION_ENCRYPT=false
      - SESSION_PATH=/
      - SESSION_DOMAIN=null
      - BROADCAST_CONNECTION=log
      - FILESYSTEM_DISK=local
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - MAIL_MAILER=log
      - MAIL_FROM_ADDRESS=noreply@suresign.app
      - MAIL_FROM_NAME=SureSign
      # Raised from the config default (16000) — a large, detailed contract
      # (58,897 input tokens) hit that ceiling and its JSON response was cut
      # off mid-string (stop_reason: max_tokens), making it unparseable.
      # 128000 is the model's real, provider-confirmed maximum output for
      # claude-sonnet-5 (live API check, 2026-07-26: 64k/100k/128k accepted,
      # 200k rejected with "max_tokens: 200000 > 128000, which is the maximum
      # allowed number of output tokens for claude-sonnet-5"). Setting the
      # ceiling this high costs nothing extra — Anthropic bills only actual
      # generated tokens, never the declared max_tokens value. This closed
      # the need for a chunked-analysis architecture (G4C.1B) for any
      # realistically-sized contract — see internal-docs/super-admin/
      # ai-credits-architecture.md.
      - ANTHROPIC_MAX_TOKENS=128000
      # Google Integration Foundation (Stage 4A) — real values come from the
      # gitignored root .env file (never hardcoded here, since this file IS
      # committed to git). GOOGLE_OAUTH_REDIRECT_URI must be a FRONTEND url
      # (Google redirects the browser there; that page calls the backend's
      # callback API with the returned code/state) — see
      # App\Services\Google\GoogleOAuthService's own docblock.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/admin/google/callback}

  queue:
    user: root
    volumes: !override
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment: *local_backend_env

  scheduler:
    user: root
    volumes: !override
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment: *local_backend_env

  mysql:
    # Prod no longer host-maps this port (removed for network-exposure
    # hardening); local dev previously inherited host access to MySQL from
    # that mapping, so it's declared explicitly here instead to keep the
    # local workflow (e.g. connecting a GUI client to localhost:3307)
    # unchanged.
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: local_dev_root_password
      MYSQL_DATABASE: suresign
      MYSQL_USER: suresign
      MYSQL_PASSWORD: SureSign@2024!
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usuresign", "-pSureSign@2024!"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Same rationale as mysql above — prod removed this host mapping, so it's
    # restated here to keep local Redis host access (e.g. redis-cli -p 6379)
    # working as before.
    ports:
      - "6379:6379"

  frontend:
    image: node:20-alpine
    container_name: suresign_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    build: !reset null
    ports: !override
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - BACKEND_INTERNAL_URL=http://backend:8000/api
      - NODE_ENV=development

  marketing:
    image: node:20-alpine
    container_name: suresign_marketing
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    build: !reset null
    ports: !override
      - "3002:3000"
    volumes:
      - ./marketing:/app
      - marketing_node_modules:/app/node_modules
      - marketing_next:/app/.next
    environment:
      # NEXT_PUBLIC_API_URL is for browser-side fetches (client
      # components) — must be host-reachable. BACKEND_INTERNAL_URL is for
      # server-side fetches (e.g. the Pricing page's server component) —
      # must be the Docker-internal service address, since `localhost`
      # inside this container means the container itself, never the
      # backend container. See marketing/src/lib/pricing.ts.
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - BACKEND_INTERNAL_URL=http://backend:8000/api
      # Organisation URL Branding, Phase 4 — where the branded login
      # gateway (marketing/src/app/login) hands off to after "Continue to
      # Sign In". Browser-facing, so NEXT_PUBLIC_ like NEXT_PUBLIC_API_URL
      # above, never the Docker-internal frontend address.
      - NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000
      - NODE_ENV=development

volumes:
  frontend_node_modules:
  marketing_node_modules:
  marketing_next:
  frontend_next:
