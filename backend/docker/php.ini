; Match PHP upload limits to the app's largest validated file upload (max:51200 KB / 50MB)
upload_max_filesize = 64M
post_max_size = 64M

; Information-disclosure hardening (L3): stop PHP announcing its own version
; via the X-Powered-By response header — an easy fingerprinting signal for
; an attacker picking version-specific exploits. This file is COPY'd to
; /usr/local/etc/php/conf.d/suresign-uploads.ini in the Dockerfile and loaded
; for every request, same as the upload settings above.
expose_php = Off
